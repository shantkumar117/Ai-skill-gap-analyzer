{% extends "base.html" %}
{% block title %}Register - AI Skill Gap Analyzer<script src="{{ url_for('static', filename='js/auth_eye.js') }}"></script>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Start your personalized learning journey</p>

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
      </div>

      <div class="form-group">
        <label for="email">Email <span style="font-size:.8rem;color:#68737d;">(required for recovery)</span></label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap" style="position:relative;">
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required style="padding-right:2.5rem;">
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="password-wrap" style="position:relative;">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required style="padding-right:2.5rem;">
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in here</a><br>
      <a href="{{ url_for('forgot_username') }}">Forgot username?</a> ·
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
    </p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/auth_eye.js') }}"></script>
{% endblock %}
