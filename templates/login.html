{% extends "base.html" %}
{% block title %}Login - AI Skill Gap Analyzer{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Log In</h1>
    <p class="auth-subtitle">Access your personalized skill gap analysis</p>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Username or email" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap" style="position:relative;">
          <input type="password" id="password" name="password" placeholder="Enter your password" required style="padding-right:2.5rem;">
        </div>
      </div>
      <script src="{{ url_for('static', filename='js/auth_eye.js') }}"></script>

      <button type="submit" class="btn-primary btn-full">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="{{ url_for('register') }}">Register here</a><br>
      <a href="{{ url_for('forgot_username') }}">Forgot username?</a> ·
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
    </p>
  </div>
</div>
{% endblock %}
