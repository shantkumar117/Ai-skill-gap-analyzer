{% extends 'base.html' %}
{% block title %}Set New Password — AI Skill Gap Analyzer{% endblock %}
{% block content %}
<section class="form-intro" aria-label="Reset password form">
  <p class="eyebrow">Account Recovery</p>
  <h1>Set a new password.</h1>
  <p>Create a secure password (at least 6 characters).</p>
</section>
<form method="post" action="" class="analysis-form auth-form" style="max-width:420px;margin:0 auto;">
  <div class="form-group">
    <label for="new_password">New password</label>
    <div class="password-wrap" style="position:relative;">
      <input id="new_password" type="password" name="new_password" minlength="6" required autocomplete="new-password" style="padding-right:2.5rem;">
    </div>
  </div>
  <div class="form-group">
    <label for="confirm_password">Confirm password</label>
    <div class="password-wrap" style="position:relative;">
      <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password" style="padding-right:2.5rem;">
    </div>
  </div>
  <button class="btn-primary btn-full" type="submit">Update password</button>
</form>
{% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
<script src="{{ url_for('static', filename='js/auth_eye.js') }}"></script>
{% endblock %}
